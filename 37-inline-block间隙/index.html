<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>37 - inline-block间隙</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
  h1 { font-size: 22px; }
  .desc { background: #fffbe6; padding: 12px; border-left: 4px solid #faad14; line-height: 1.7; }
  code { background: #f0f0f0; padding: 2px 5px; }

  /* 行内有空白字符 → 渲染成空格间隙 */
  .default span { display: inline-block; width: 100px; height: 50px; background: #1890ff; color: #fff; text-align: center; line-height: 50px; }

  /* 方案1：父元素 font-size:0 */
  .fs0 { font-size: 0; }
  .fs0 span { font-size: 16px; }

  /* 方案2：letter-spacing 负值 */
  .ls span { letter-spacing: -8px; letter-spacing: -0.5em; }
  .ls span { letter-spacing: normal; } /* 后重置 */

  /* 方案3：word-spacing */
  .ws span { display: inline-block; width: 100px; height: 50px; background: #52c41a; color: #fff; text-align: center; line-height: 50px; }
  .ws { word-spacing: -1em; }

  /* 方案4：父设 flex */
  .flex { display: flex; }
  .flex span { width: 100px; height: 50px; background: #faad14; color: #fff; text-align: center; line-height: 50px; }

  /* 方案5：注释消除空白 */
  .comment span { display: inline-block; width: 100px; height: 50px; background: #f5222d; color: #fff; text-align: center; line-height: 50px; }

  .box { background: #fff; padding: 8px; border: 1px solid #ccc; margin: 10px 0; }
  h3 { margin-top: 18px; }
  .note { color:#999; font-size:13px; }
</style>
</head>
<body>
  <h1>37. inline-block 间隙问题</h1>
  <div class="desc">
    HTML 中 inline-block 元素之间的换行/空格会被渲染成约 4px 的空白间隙（继承 font-size 相关）。
  </div>

  <h3>原始：有间隙</h3>
  <div class="box default">
    <span>A</span>
    <span>B</span>
    <span>C</span>
  </div>
  <p class="note">↑ 三个 span 之间有间隙（来自源码空白字符）</p>

  <h3>方案1：父元素 font-size:0</h3>
  <div class="box fs0">
    <span>A</span>
    <span>B</span>
    <span>C</span>
  </div>
  <p class="note">父 font-size:0 把空白字符去掉，子元素重置字号</p>

  <h3>方案2：word-spacing 负值</h3>
  <div class="box ws">
    <span>A</span>
    <span>B</span>
    <span>C</span>
  </div>

  <h3>方案3：用 flex 布局（推荐）</h3>
  <div class="box flex">
    <span>A</span><span>B</span><span>C</span>
  </div>

  <h3>方案4：HTML 注释消除空白字符</h3>
  <div class="box comment">
    <span>A</span><!--
    --><span>B</span><!--
    --><span>C</span>
  </div>

  <h3>方案5：标签紧挨不换行</h3>
  <div class="box comment">
    <span>A</span><span>B</span><span>C</span>
  </div>
</body>
</html>
