<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>2D变形：scale、translate</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    .demo-row {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .box {
      width: 100px;
      height: 100px;
      background: lightblue;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 12px;
    }

    /* scale */
    .scale-x {
      transform: scaleX(1.5);
    }

    .scale-y {
      transform: scaleY(1.5);
    }

    .scale-both {
      transform: scale(1.5);
    }

    .scale-down {
      transform: scale(0.6);
    }

    .scale-neg {
      transform: scale(-1);
    }

    /* translate */
    .translate-x {
      transform: translateX(50px);
    }

    .translate-y {
      transform: translateY(30px);
    }

    .translate-both {
      transform: translate(50px, 30px);
    }

    .translate-percent {
      transform: translate(50%, 50%);
    }

    /* transform-origin */
    .origin-default {
      transform: rotate(30deg);
    }

    .origin-top-left {
      transform-origin: top left;
      transform: rotate(30deg);
    }

    .origin-bottom-right {
      transform-origin: bottom right;
      transform: rotate(30deg);
    }

    .origin-center {
      transform-origin: center;
      transform: rotate(30deg);
    }

    .container {
      border: 1px dashed gray;
      padding: 30px;
      display: inline-block;
      margin: 5px;
    }

    h3 { margin: 15px 0 5px; }
    p { margin: 0 0 5px; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>
  <h2>2D变形：scale、translate</h2>

  <h3>scale - 缩放</h3>
  <div class="demo-row">
    <div class="container">
      <div class="box">原始</div>
    </div>
    <div class="container">
      <div class="box scale-x">scaleX(1.5)</div>
    </div>
    <div class="container">
      <div class="box scale-y">scaleY(1.5)</div>
    </div>
    <div class="container">
      <div class="box scale-both">scale(1.5)</div>
    </div>
    <div class="container">
      <div class="box scale-down">scale(0.6)</div>
    </div>
  </div>

  <h3>translate - 移动</h3>
  <div class="demo-row">
    <div class="container">
      <div class="box translate-x">translateX(50px)</div>
    </div>
    <div class="container">
      <div class="box translate-y">translateY(30px)</div>
    </div>
    <div class="container">
      <div class="box translate-both">translate(50, 30)</div>
    </div>
  </div>

  <h3>transform-origin - 变形原点</h3>
  <div class="demo-row">
    <div class="container">
      <div class="box origin-default">默认(中心) rotate(30)</div>
    </div>
    <div class="container">
      <div class="box origin-top-left">top left rotate(30)</div>
    </div>
    <div class="container">
      <div class="box origin-bottom-right">bottom right rotate(30)</div>
    </div>
  </div>
</body>
</html>
