<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>2D变形：rotate、skew</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    .demo-row {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .box {
      width: 100px;
      height: 100px;
      background: lightblue;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 12px;
    }

    .rotate-45 {
      transform: rotate(45deg);
    }

    .rotate-neg {
      transform: rotate(-30deg);
    }

    .skew-x {
      transform: skewX(25deg);
    }

    .skew-y {
      transform: skewY(15deg);
    }

    .skew-both {
      transform: skew(23deg, 23deg);
    }

    .rotate-skew-scale {
      transform: rotate(30deg) skewX(-25deg) scaleY(2);
    }

    .container {
      border: 1px dashed gray;
      padding: 30px;
      display: inline-block;
      margin: 5px;
    }

    h3 { margin: 15px 0 5px; }
    p { margin: 0 0 5px; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>
  <h2>2D变形：rotate、skew</h2>

  <h3>rotate - 旋转</h3>
  <div class="demo-row">
    <div class="container">
      <div class="box">原始</div>
    </div>
    <div class="container">
      <div class="box rotate-45">rotate(45deg)</div>
    </div>
    <div class="container">
      <div class="box rotate-neg">rotate(-30deg)</div>
    </div>
  </div>

  <h3>skew - 倾斜</h3>
  <div class="demo-row">
    <div class="container">
      <div class="box skew-x">skewX(25deg)</div>
    </div>
    <div class="container">
      <div class="box skew-y">skewY(15deg)</div>
    </div>
    <div class="container">
      <div class="box skew-both">skew(23, 23)</div>
    </div>
  </div>

  <h3>组合变形</h3>
  <div class="demo-row">
    <div class="container">
      <div class="box rotate-skew-scale">rotate(30) skewX(-25) scaleY(2)</div>
    </div>
  </div>
</body>
</html>
