<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>flex-direction 和 flex-wrap</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    .flex-container {
      display: flex;
      background-color: rgba(0, 0, 0, 0.1);
      border: 1px dashed;
      padding: 5px;
      margin-bottom: 10px;
    }

    .flex-container > div {
      border: 1px solid;
      padding: 10px;
      margin: 5px;
      background: rgba(255, 255, 255, 0.8);
    }

    .row { flex-direction: row; }
    .row-reverse { flex-direction: row-reverse; }
    .column { flex-direction: column; }
    .column-reverse { flex-direction: column-reverse; }
    .wrap { flex-wrap: wrap; }
    .nowrap { flex-wrap: nowrap; }

    h3 { margin: 15px 0 5px; }
    p { margin: 0 0 5px; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>
  <h2>flex-direction 和 flex-wrap</h2>

  <h3>flex-direction</h3>

  <p>flex-direction: row (默认)</p>
  <div class="flex-container row">
    <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div>
  </div>

  <p>flex-direction: row-reverse</p>
  <div class="flex-container row-reverse">
    <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div>
  </div>

  <p>flex-direction: column</p>
  <div class="flex-container column">
    <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div>
  </div>

  <p>flex-direction: column-reverse</p>
  <div class="flex-container column-reverse">
    <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div>
  </div>

  <h3>flex-wrap</h3>

  <p>flex-wrap: nowrap (默认) - 不换行</p>
  <div class="flex-container nowrap" style="width: 300px;">
    <div style="min-width: 100px;">1</div>
    <div style="min-width: 100px;">2</div>
    <div style="min-width: 100px;">3</div>
    <div style="min-width: 100px;">4</div>
  </div>

  <p>flex-wrap: wrap - 自动换行</p>
  <div class="flex-container wrap" style="width: 300px;">
    <div style="min-width: 100px;">1</div>
    <div style="min-width: 100px;">2</div>
    <div style="min-width: 100px;">3</div>
    <div style="min-width: 100px;">4</div>
  </div>
</body>
</html>
