<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>CSS滤镜</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    h3 { margin: 20px 0 10px; }

    .filter-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-box {
      width: 200px;
      height: 150px;
      border: 2px solid #333;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .filter-box .content {
      flex: 1;
      padding: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .filter-box .label {
      padding: 5px;
      text-align: center;
      font-family: monospace;
      font-size: 12px;
      background: #eee;
    }

    /* 基本滤镜 */
    .blur { filter: blur(3px); }
    .opacity { filter: opacity(0.5); }
    .drop-shadow { filter: drop-shadow(5px 5px 5px rgba(0,0,0,0.5)); }

    /* 颜色滤镜 */
    .grayscale { filter: grayscale(100%); }
    .sepia { filter: sepia(100%); }
    .invert { filter: invert(100%); }
    .hue-rotate { filter: hue-rotate(90deg); }

    /* 亮度/对比度/饱和度 */
    .brightness { filter: brightness(1.5); }
    .contrast { filter: contrast(200%); }
    .saturate { filter: saturate(200%); }

    /* 组合滤镜 */
    .combined { filter: blur(2px) grayscale(50%) brightness(1.2); }
  </style>
</head>
<body>
  <h2>CSS滤镜：filter</h2>

  <h3>基本滤镜</h3>
  <div class="filter-row">
    <div class="filter-box">
      <div class="content">原始</div>
      <div class="label">无滤镜</div>
    </div>
    <div class="filter-box">
      <div class="content blur">模糊</div>
      <div class="label">blur(3px)</div>
    </div>
    <div class="filter-box">
      <div class="content opacity">半透明</div>
      <div class="label">opacity(0.5)</div>
    </div>
    <div class="filter-box">
      <div class="content drop-shadow">投影</div>
      <div class="label">drop-shadow(5px 5px 5px)</div>
    </div>
  </div>

  <h3>颜色滤镜</h3>
  <div class="filter-row">
    <div class="filter-box">
      <div class="content grayscale">灰度</div>
      <div class="label">grayscale(100%)</div>
    </div>
    <div class="filter-box">
      <div class="content sepia">褐色</div>
      <div class="label">sepia(100%)</div>
    </div>
    <div class="filter-box">
      <div class="content invert">反色</div>
      <div class="label">invert(100%)</div>
    </div>
    <div class="filter-box">
      <div class="content hue-rotate">色相旋转</div>
      <div class="label">hue-rotate(90deg)</div>
    </div>
  </div>

  <h3>亮度、对比度、饱和度</h3>
  <div class="filter-row">
    <div class="filter-box">
      <div class="content brightness">高亮度</div>
      <div class="label">brightness(1.5)</div>
    </div>
    <div class="filter-box">
      <div class="content contrast">高对比</div>
      <div class="label">contrast(200%)</div>
    </div>
    <div class="filter-box">
      <div class="content saturate">高饱和</div>
      <div class="label">saturate(200%)</div>
    </div>
  </div>

  <h3>组合滤镜</h3>
  <div class="filter-row">
    <div class="filter-box">
      <div class="content combined">组合效果</div>
      <div class="label">blur(2) grayscale(50%) brightness(1.2)</div>
    </div>
  </div>
</body>
</html>
