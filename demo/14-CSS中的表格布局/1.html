<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>表格边框模型</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    table {
      margin-bottom: 20px;
    }

    td {
      padding: 0.5em;
    }

    /* 分离边框模型 */
    .separate {
      border-collapse: separate;
      border-spacing: 5px 8px;
      border: 2px solid black;
    }

    .separate td {
      border: 1px solid gray;
    }

    .separate #squeeze {
      border-width: 5px;
    }

    /* 折叠边框模型 */
    .collapse {
      border-collapse: collapse;
      border: 3px outset gray;
    }

    .collapse td {
      border: 1px solid gray;
      padding: 0.5em;
    }

    .collapse #r2c1,
    .collapse #r2c2 {
      border-style: hidden;
    }

    .collapse #r1c1,
    .collapse #r1c4 {
      border-width: 5px;
    }

    .collapse #r2c4 {
      border-style: double;
      border-width: 3px;
    }

    h3 { margin: 15px 0 5px; }
    p { margin: 0 0 10px; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>
  <h2>表格边框模型</h2>

  <h3>分离边框模型 (border-collapse: separate)</h3>
  <p>border-spacing: 5px 8px; - 单元格之间有间距</p>
  <table class="separate">
    <tr>
      <td>cell one</td>
      <td>cell two</td>
    </tr>
    <tr>
      <td>cell three</td>
      <td id="squeeze">cell four (5px border)</td>
    </tr>
  </table>

  <h3>折叠边框模型 (border-collapse: collapse)</h3>
  <p>相邻边框折叠在一起，较宽的边框胜出</p>
  <table class="collapse">
    <tr>
      <td id="r1c1">1-1 (5px)</td>
      <td id="r1c2">1-2</td>
      <td id="r1c3">1-3</td>
      <td id="r1c4">1-4 (5px)</td>
    </tr>
    <tr>
      <td id="r2c1">2-1 (hidden)</td>
      <td id="r2c2">2-2 (hidden)</td>
      <td id="r2c3">2-3</td>
      <td id="r2c4">2-4 (double 3px)</td>
    </tr>
    <tr>
      <td id="r3c1">3-1</td>
      <td id="r3c2">3-2</td>
      <td id="r3c3">3-3</td>
      <td id="r3c4">3-4</td>
    </tr>
  </table>
</body>
</html>
