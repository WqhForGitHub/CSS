<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>表格尺寸与对齐</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    h3 { margin: 15px 0 5px; }
    p { margin: 0 0 10px; font-family: monospace; font-size: 14px; }

    /* 固定布局 */
    .fixed-table {
      table-layout: fixed;
      width: 400px;
      border-collapse: collapse;
    }

    .fixed-table td {
      border: 1px solid;
      padding: 5px;
    }

    .fixed-table col#c1 {
      width: 200px;
    }

    .fixed-table #r1c2 {
      width: 75px;
    }

    /* 垂直对齐 */
    .align-table {
      table-layout: auto;
      width: 20em;
      border-collapse: separate;
      border-spacing: 3px;
    }

    .align-table td {
      border: 1px dashed gray;
      background: silver;
      padding: 0;
    }

    .align-table div {
      border: 1px dashed gray;
      background: white;
      padding: 5px;
    }

    .align-table #top {
      vertical-align: top;
      height: 8em;
    }

    .align-table #middle {
      vertical-align: middle;
    }

    .align-table #bottom {
      vertical-align: bottom;
    }

    /* 表格层 */
    .layer-table {
      background: #B84;
      border-collapse: collapse;
    }

    .layer-table td {
      padding: 10px;
      border: 1px solid gray;
    }

    .layer-table .cell-bg {
      background: #ABC;
    }

    .layer-table .row-bg {
      background: #CBA;
    }

    .layer-table .cell-bg2 {
      background: #ECC;
    }
  </style>
</head>
<body>
  <h2>表格尺寸与对齐</h2>

  <h3>固定宽度布局 (table-layout: fixed)</h3>
  <p>宽度由第一行决定，后续行忽略 width</p>
  <table class="fixed-table">
    <colgroup>
      <col id="c1">
      <col id="c2">
      <col id="c3">
      <col id="c4">
    </colgroup>
    <tr>
      <td id="r1c1">200px</td>
      <td id="r1c2">75px</td>
      <td id="r1c3">auto</td>
      <td id="r1c4">auto</td>
    </tr>
    <tr>
      <td>2-1</td>
      <td>2-2 (width被忽略)</td>
      <td>2-3</td>
      <td>2-4</td>
    </tr>
  </table>

  <h3>单元格垂直对齐 (vertical-align)</h3>
  <table class="align-table">
    <tr>
      <td id="top">
        <div>vertical-align: top</div>
      </td>
      <td id="middle">
        <div>vertical-align: middle</div>
      </td>
      <td id="bottom">
        <div>vertical-align: bottom</div>
      </td>
    </tr>
  </table>

  <h3>表格中的层（背景透明性）</h3>
  <table class="layer-table">
    <tr>
      <td>hey</td>
      <td class="cell-bg">there</td>
    </tr>
    <tr>
      <td>what's</td>
      <td>up?</td>
    </tr>
    <tr class="row-bg">
      <td>not</td>
      <td class="cell-bg2">much</td>
    </tr>
  </table>
</body>
</html>
