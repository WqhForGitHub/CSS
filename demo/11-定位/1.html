<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>定位类型</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
    }

    .demo-box {
      border: 2px solid #333;
      padding: 10px;
      margin-bottom: 30px;
      position: relative;
      min-height: 120px;
    }

    .box {
      padding: 10px;
      color: white;
      font-weight: bold;
    }

    /* static - 默认定位 */
    .static {
      position: static;
      background: #888;
    }

    /* relative - 相对定位 */
    .relative {
      position: relative;
      top: 10px;
      left: 20px;
      background: hsl(120, 50%, 40%);
    }

    /* absolute - 绝对定位 */
    .absolute {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 120px;
      background: hsl(240, 50%, 50%);
    }

    /* fixed - 固定定位 */
    .fixed {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: hsl(0, 50%, 50%);
      padding: 10px;
      color: white;
      font-weight: bold;
      border: 2px solid #333;
      z-index: 100;
    }

    h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <h2>定位类型：position 属性</h2>

  <div class="demo-box">
    <h3>position: static（默认）</h3>
    <div class="box static">static - 正常文档流中的位置</div>
  </div>

  <div class="demo-box">
    <h3>position: relative + top: 10px + left: 20px</h3>
    <div class="box relative">relative - 相对原来的位置偏移，原来的空间保留</div>
  </div>

  <div class="demo-box">
    <h3>position: absolute + top: 10px + right: 10px</h3>
    <div class="box absolute">absolute - 相对容纳块定位，脱离文档流</div>
    <p>绝对定位元素完全从文档流中移除，可能覆盖其他内容。</p>
  </div>

  <div class="fixed">fixed - 固定在视区右下角</div>
</body>
</html>
