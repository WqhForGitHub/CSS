<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>绝对定位与容纳块</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
    }

    .contain {
      position: relative;
      border: 2px solid #333;
      padding: 10px;
      margin: 2em;
      min-height: 150px;
    }

    .no-contain {
      border: 2px solid #999;
      padding: 10px;
      margin: 2em;
      min-height: 100px;
    }

    .abs {
      position: absolute;
      top: 0;
      right: 0;
      width: 10em;
      height: 5em;
      border: 1px solid gray;
      background: rgba(200, 200, 200, 0.8);
      padding: 5px;
    }

    /* 使用偏移属性确定元素尺寸 */
    .sized-by-offset {
      position: relative;
      border: 2px solid #333;
      height: 10em;
      margin-bottom: 20px;
    }

    .fill-left {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 50%;
      background: rgba(150, 150, 255, 0.5);
    }

    .fill-right-bottom {
      position: absolute;
      top: 50%;
      bottom: 0;
      left: 50%;
      right: 0;
      background: rgba(150, 255, 150, 0.5);
    }

    h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <h2>绝对定位与容纳块</h2>

  <div class="no-contain">
    <p>这个 div 没有 position: relative，因此内部的绝对定位元素将相对<strong>初始容纳块</strong>定位：</p>
    <div class="abs">绝对定位元素（相对初始容纳块）</div>
  </div>

  <div class="contain">
    <p>这个 div 设置了 position: relative，因此它是内部绝对定位元素的<strong>容纳块</strong>：</p>
    <div class="abs">绝对定位元素（相对父元素）</div>
  </div>

  <h3>使用偏移属性确定元素尺寸</h3>
  <div class="sized-by-offset">
    <div class="fill-left">top:0; bottom:0; left:0; right:50%</div>
    <div class="fill-right-bottom">top:50%; bottom:0; left:50%; right:0</div>
  </div>
</body>
</html>
