<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双飞翼布局 - Double Flying Wings Layout</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-width: 600px;
        font-family: "Microsoft YaHei", sans-serif;
        color: #fff;
      }

      /* 头部与尾部：通栏 */
      header,
      footer {
        width: 100%;
        height: 80px;
        background: #34495e;
        text-align: center;
        line-height: 80px;
        font-size: 20px;
      }

      /*
         * 双飞翼布局核心（与圣杯布局的区别）：
         * 1. 不在 container 上加 padding，而是在 middle 内部嵌一个 main 容器
         * 2. 通过 main 的左右 margin 让出左右两栏空间
         * 3. left / right 不需要相对定位，结构更简单，不会出现定位偏移问题
         * 4. 同样保证 middle 写在最前，主体内容优先加载
         */
      .middle,
      .left,
      .right {
        float: left;
        min-height: 300px;
      }

      .middle {
        width: 100%;
        background: #16a085;
      }

      /* 内层 main 通过 margin 给左右栏腾出位置 */
      .main {
        margin-left: 200px; /* 左栏宽度 */
        margin-right: 220px; /* 右栏宽度 */
        min-height: 300px;
      }

      .left {
        width: 200px;
        margin-left: -100%; /* 移到 middle 最左侧 */
        background: #e67e22;
      }

      .right {
        width: 220px;
        margin-left: -220px; /* 移到 middle 最右侧 */
        background: #9b59b6;
      }

      /* 清除浮动 */
      .container {
        overflow: hidden;
      }

      .main p,
      .left p,
      .right p {
        padding: 20px;
        font-size: 18px;
      }

      .tag {
        display: inline-block;
        margin-top: 10px;
        padding: 4px 12px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>Header 通栏头部</header>

    <div class="container">
      <!-- middle 写在最前，内部嵌套 main 容器 -->
      <div class="middle">
        <div class="main">
          <p>
            Main 主体内容（自适应宽度）
            <span class="tag">margin-left: 200px; margin-right: 220px</span>
          </p>
        </div>
      </div>
      <div class="left">
        <p>
          Left 左栏（固定 200px）
          <span class="tag">margin-left: -100%</span>
        </p>
      </div>
      <div class="right">
        <p>
          Right 右栏（固定 220px）
          <span class="tag">margin-left: -220px</span>
        </p>
      </div>
    </div>

    <footer>Footer 通栏尾部</footer>
  </body>
</html>
